<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Editor - Editorial Studio</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #000000;
  color: #ffffff;
  line-height: 1.5;
  font-size: 13px;
  display: flex;
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

.sidebar {
  width: 220px;
  background-color: #0c0c0c;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  border-right: 1px solid #1f1f1f;
}

.sidebar-header {
  padding: 20px 16px;
  border-bottom: 1px solid #1f1f1f;
}

.brand-title {
  font-size: 15px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: 0.5px;
}

.brand-sub {
  font-size: 11px;
  color: #777777;
  margin-top: 3px;
}

.sidebar-menu {
  flex: 1;
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.menu-label {
  font-size: 10px;
  font-weight: bold;
  color: #555555;
  text-transform: uppercase;
  padding: 8px 10px 4px;
  letter-spacing: 0.5px;
}

.nav-link {
  display: block;
  padding: 9px 12px;
  color: #888888;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
}

.nav-link:hover {
  background-color: #161616;
  color: #ffffff;
}

.nav-link.active {
  background-color: #1f1f1f;
  color: #ffffff;
  font-weight: bold;
  border-left: 2px solid #f04023;
}

.nav-link.btn-create {
  background-color: #f04023;
  color: #ffffff;
  margin-top: 12px;
  text-align: center;
  font-weight: bold;
  border-radius: 20px;
}

.nav-link.btn-create:hover {
  background-color: #d63318;
}

.sidebar-user {
  padding: 14px 16px;
  border-top: 1px solid #1f1f1f;
  display: flex;
  align-items: center;
  gap: 10px;
  background-color: #080808;
}

.user-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background-color: #f04023;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
}

.user-name {
  font-size: 13px;
  font-weight: bold;
  color: #ffffff;
}

.user-role {
  font-size: 11px;
  color: #777777;
}

.main-content {
  margin-left: 220px;
  flex: 1;
  padding: 24px 28px;
  min-width: 0;
  background-color: #000000;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #0c0c0c;
  padding: 18px 22px;
  border: 1px solid #1f1f1f;
  border-radius: 6px;
  margin-bottom: 22px;
}

.page-title {
  font-size: 22px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: -0.3px;
}

.page-subtitle {
  font-size: 12px;
  color: #888888;
  margin-top: 3px;
}

.card {
  background-color: #0c0c0c;
  border: 1px solid #1f1f1f;
  border-radius: 6px;
  padding: 22px;
  margin-bottom: 20px;
}

.card-title {
  font-size: 14px;
  font-weight: bold;
  color: #ffffff;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #1a1a1a;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #888888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-control {
  width: 100%;
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid #262626;
  border-radius: 4px;
  background-color: #121212;
  color: #ffffff;
  font-family: inherit;
}

.form-control:focus {
  border-color: #f04023;
  outline: none;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.editor-textarea {
  width: 100%;
  height: 140px;
  padding: 12px;
  border: 1px solid #262626;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.6;
  font-family: Arial, Helvetica, sans-serif;
  resize: vertical;
  background-color: #121212;
  color: #ffffff;
}

.editor-textarea:focus {
  border-color: #f04023;
  outline: none;
}

.btn {
  display: inline-block;
  padding: 7px 15px;
  font-size: 12px;
  font-weight: bold;
  border-radius: 18px;
  text-align: center;
  border: 1px solid #2a2a2a;
  background-color: #141414;
  color: #ffffff;
  cursor: pointer;
  text-decoration: none;
}

.btn:hover {
  background-color: #202020;
  border-color: #444444;
}

.btn-orange {
  background-color: #f04023;
  color: #ffffff;
  border-color: #f04023;
}

.btn-orange:hover {
  background-color: #d63318;
}

.btn-secondary {
  background-color: #141414;
  color: #888888;
  border-color: #222222;
}

.btn-secondary:hover {
  color: #ffffff;
  border-color: #444444;
}

@media (max-width: 700px) {
  body {
    flex-direction: column;
  }
  .sidebar {
    position: static;
    width: 100%;
    min-height: auto;
  }
  .main-content {
    margin-left: 0;
    padding: 16px;
  }
  .form-row {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">EDITORIAL STUDIO</div>
      <div class="brand-sub">Mini Project 2026</div>
    </div>

    <div class="sidebar-menu">
      <div class="menu-label">Navigation</div>
      <a href="index.html" class="nav-link">Home (Landing)</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="content.html" class="nav-link">All Articles</a>
      <a href="board.html" class="nav-link">Editorial Board</a>
      <a href="editor.html" class="nav-link btn-create active">+ Write Article</a>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">D</div>
      <div>
        <div class="user-name">Devansh</div>
        <div class="user-role">Lead Editor</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Article Editor</h1>
        <p class="page-subtitle">Submit or edit article details in dark studio.</p>
      </div>
      <div>
        <a href="content.html" class="btn btn-secondary">Back to List</a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Article Form</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Article Title</label>
          <input type="text" class="form-control" value="HTML5 &amp; CSS3 Project Guide">
        </div>
        <div class="form-group">
          <label class="form-label">Author Name</label>
          <input type="text" class="form-control" value="Devansh" readonly>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-control">
            <option selected>Web Development</option>
            <option>Database</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control">
            <option selected>In Review</option>
            <option>Draft</option>
            <option>Published</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Article Content</label>
        <textarea class="editor-textarea">A responsive editorial workflow interface built using semantic HTML5 and CSS3 for college mini project.</textarea>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary">Save Draft</button>
        <button class="btn btn-orange">Submit for Review</button>
        <a href="content.html" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </div>

</body>
</html>
