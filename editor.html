<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Editor - Editorial Studio</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #f4f6f9;
  color: #333333;
  line-height: 1.5;
  font-size: 13px;
  display: flex;
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

.sidebar {
  width: 220px;
  background-color: #2c3e50;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
}

.sidebar-header {
  padding: 18px 16px;
  border-bottom: 1px solid #34495e;
}

.brand-title {
  font-size: 15px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: 0.5px;
}

.brand-sub {
  font-size: 11px;
  color: #bdc3c7;
  margin-top: 3px;
}

.sidebar-menu {
  flex: 1;
  padding: 15px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.menu-label {
  font-size: 10px;
  font-weight: bold;
  color: #95a5a6;
  text-transform: uppercase;
  padding: 8px 10px 4px;
}

.nav-link {
  display: block;
  padding: 9px 12px;
  color: #ecf0f1;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
}

.nav-link:hover {
  background-color: #34495e;
  color: #ffffff;
}

.nav-link.active {
  background-color: #007bff;
  color: #ffffff;
  font-weight: bold;
}

.nav-link.btn-create {
  background-color: #28a745;
  color: #ffffff;
  margin-top: 10px;
  text-align: center;
  font-weight: bold;
}

.nav-link.btn-create:hover {
  background-color: #218838;
}

.sidebar-user {
  padding: 12px 16px;
  border-top: 1px solid #34495e;
  display: flex;
  align-items: center;
  gap: 10px;
  background-color: #243342;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background-color: #e67e22;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
}

.user-name {
  font-size: 13px;
  font-weight: bold;
  color: #ffffff;
}

.user-role {
  font-size: 11px;
  color: #bdc3c7;
}

.main-content {
  margin-left: 220px;
  flex: 1;
  padding: 22px 25px;
  min-width: 0;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #ffffff;
  padding: 15px 20px;
  border: 1px solid #dcdcdc;
  border-radius: 4px;
  margin-bottom: 20px;
}

.page-title {
  font-size: 20px;
  font-weight: bold;
  color: #2c3e50;
}

.page-subtitle {
  font-size: 12px;
  color: #666666;
  margin-top: 2px;
}

.card {
  background-color: #ffffff;
  border: 1px solid #dcdcdc;
  border-radius: 4px;
  padding: 18px;
  margin-bottom: 20px;
}

.card-title {
  font-size: 14px;
  font-weight: bold;
  color: #2c3e50;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #eeeeee;
}

.form-group {
  margin-bottom: 15px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
  color: #333333;
}

.form-control {
  width: 100%;
  padding: 7px 10px;
  font-size: 13px;
  border: 1px solid #ced4da;
  border-radius: 3px;
  background-color: #ffffff;
  font-family: inherit;
}

.form-control:focus {
  border-color: #007bff;
  outline: none;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.editor-textarea {
  width: 100%;
  height: 120px;
  padding: 10px;
  border: 1px solid #ced4da;
  border-radius: 3px;
  font-size: 13px;
  line-height: 1.5;
  font-family: Arial, Helvetica, sans-serif;
  resize: vertical;
}

.btn {
  display: inline-block;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 3px;
  text-align: center;
  border: 1px solid #ccc;
  background-color: #ffffff;
  color: #333333;
  cursor: pointer;
  text-decoration: none;
}

.btn:hover {
  background-color: #e9ecef;
}

.btn-primary {
  background-color: #007bff;
  color: #ffffff;
  border-color: #007bff;
}

.btn-primary:hover {
  background-color: #0069d9;
}

.btn-success {
  background-color: #28a745;
  color: #ffffff;
  border-color: #28a745;
}

.btn-success:hover {
  background-color: #218838;
}

.btn-secondary {
  background-color: #6c757d;
  color: #ffffff;
  border-color: #6c757d;
}

.btn-secondary:hover {
  background-color: #5a6268;
}

@media (max-width: 700px) {
  body {
    flex-direction: column;
  }
  .sidebar {
    position: static;
    width: 100%;
    min-height: auto;
  }
  .main-content {
    margin-left: 0;
    padding: 15px;
  }
  .form-row {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">EDITORIAL STUDIO</div>
      <div class="brand-sub">Mini Project</div>
    </div>

    <div class="sidebar-menu">
      <div class="menu-label">Navigation</div>
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="content.html" class="nav-link">All Articles</a>
      <a href="board.html" class="nav-link">Editorial Board</a>
      <a href="editor.html" class="nav-link btn-create active">+ Write Article</a>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">D</div>
      <div>
        <div class="user-name">Devansh</div>
        <div class="user-role">Editor</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Article Editor</h1>
        <p class="page-subtitle">Submit or edit article details.</p>
      </div>
      <div>
        <a href="content.html" class="btn btn-secondary">Back to List</a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Article Form</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Article Title</label>
          <input type="text" class="form-control" value="HTML5 & CSS3 Project Guide">
        </div>
        <div class="form-group">
          <label class="form-label">Author Name</label>
          <input type="text" class="form-control" value="Devansh" readonly>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-control">
            <option selected>Web Development</option>
            <option>Database</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control">
            <option>Draft</option>
            <option selected>In Review</option>
            <option>Published</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Article Content</label>
        <textarea class="editor-textarea">A responsive editorial workflow interface built using semantic HTML5 and CSS3 for college mini project.</textarea>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary">Save Draft</button>
        <button class="btn btn-success">Submit for Review</button>
        <a href="content.html" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </div>

</body>
</html>
