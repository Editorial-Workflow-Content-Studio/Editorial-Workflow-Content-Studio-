<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Editor - Editorial Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #000000;
  color: #ffffff;
}

.sidebar {
  width: 230px;
  background-color: #0a0a0a;
  border-right: 1px solid #1f1f1f;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 20px 18px;
  border-bottom: 1px solid #1f1f1f;
}

.sidebar-menu {
  flex: 1;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  color: #888888;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
}

.nav-link:hover {
  background-color: #141414;
  color: #ffffff;
}

.nav-link.active {
  background-color: #1a1a1a;
  color: #ffffff !important;
  border-left: 3px solid #f04023;
  font-weight: bold;
}

.sidebar-user {
  padding: 14px 18px;
  border-top: 1px solid #1f1f1f;
  display: flex;
  align-items: center;
  gap: 10px;
  background-color: #060606;
}

.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background-color: #f04023;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
}

.main-content {
  margin-left: 230px;
  padding: 26px 30px;
  min-height: 100vh;
}

.btn-orange {
  background-color: #f04023;
  color: #ffffff;
  border-color: #f04023;
}

.btn-orange:hover {
  background-color: #d63318;
  color: #ffffff;
}

.card-dark {
  background-color: #0c0c0c;
  border: 1px solid #1f1f1f;
}

@media (max-width: 768px) {
  .sidebar {
    position: static;
    width: 100%;
  }
  .main-content {
    margin-left: 0;
    padding: 16px;
  }
}
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="fw-bold text-white fs-6">EDITORIAL STUDIO</div>
      <div class="text-secondary small">Mini Project 2026</div>
    </div>

    <div class="sidebar-menu">
      <div class="text-secondary text-uppercase px-2 py-1 small fw-bold" style="font-size: 10px;">Menu</div>
      <a href="index.html" class="nav-link"><i class="bi bi-house-door"></i> Home (Landing)</a>
      <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="board.html" class="nav-link"><i class="bi bi-kanban"></i> Editorial Board</a>
      <a href="editor.html" class="nav-link btn-orange rounded-pill text-center text-white mt-3 py-2 fw-bold active justify-content-center"><i class="bi bi-pencil-square"></i> Write Article</a>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">D</div>
      <div>
        <div class="fw-bold text-white small">Devansh</div>
        <div class="text-secondary small" style="font-size: 11px;">Lead Editor</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="card card-dark p-4 mb-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h1 class="h4 text-white fw-bold mb-1">Article Editor</h1>
          <p class="text-secondary small mb-0">Submit or edit article details in dark studio.</p>
        </div>
        <div>
          <a href="dashboard.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
        </div>
      </div>
    </div>

    <div class="card card-dark p-4">
      <div class="fw-bold text-white mb-3 pb-2 border-bottom border-secondary d-flex align-items-center gap-2">
        <i class="bi bi-file-earmark-diff text-danger"></i> Article Submission Form
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label text-secondary small text-uppercase fw-bold">Article Title</label>
          <input type="text" class="form-control bg-dark text-white border-secondary" value="HTML5 &amp; CSS3 Project Guide">
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small text-uppercase fw-bold">Author Name</label>
          <input type="text" class="form-control bg-dark text-white border-secondary" value="Devansh" readonly>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label text-secondary small text-uppercase fw-bold">Category</label>
          <select class="form-select bg-dark text-white border-secondary">
            <option selected>Web Development</option>
            <option>Database</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small text-uppercase fw-bold">Status</label>
          <select class="form-select bg-dark text-white border-secondary">
            <option selected>In Review</option>
            <option>Draft</option>
            <option>Published</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary small text-uppercase fw-bold">Article Content</label>
        <textarea class="form-control bg-dark text-white border-secondary" rows="4">A responsive editorial workflow interface built using semantic HTML5, CSS3, and Bootstrap 5 for college mini project.</textarea>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary rounded-pill px-3"><i class="bi bi-save me-1"></i>Save Draft</button>
        <button class="btn btn-orange rounded-pill px-4 fw-bold"><i class="bi bi-send me-1"></i>Submit for Review</button>
        <a href="dashboard.html" class="btn btn-outline-secondary rounded-pill px-3">Cancel</a>
      </div>
    </div>
  </div>

</body>
</html>
